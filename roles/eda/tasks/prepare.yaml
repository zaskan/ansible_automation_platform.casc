- name: Wait for EDA Route to be Created
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ aap_ocp.name }}"
    namespace: "{{ aap_ocp.namespace }}"
  until:
    - eda.resources[0].spec.host is defined
    - eda.resources[0].spec.host != ""
  retries: 60
  delay: 10
  register: eda

- name: Set EDA Hostname Information
  ansible.builtin.set_fact:
    eda_host: "{{ eda.resources[0].spec.host }}"

- name: Set EDA Username Information
  ansible.builtin.set_fact:
    eda_username: "{{ aap_username }}"

- name: Set EDA Password Information
  ansible.builtin.set_fact:
    eda_pass: "{{ aap_password }}"
